name: iOS

# 每次推送 / PR：在模拟器上编译，确认代码能过。
# 合并到 main、打 v* 标签或手动触发：归档并自动上传 TestFlight。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: LiveSubtitle.xcodeproj
  SCHEME: LiveSubtitle

jobs:
  build:
    name: 编译检查（模拟器）
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 编译
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E '(error|warning: |BUILD (SUCCEEDED|FAILED))' || true
          grep -q 'BUILD SUCCEEDED' build.log

      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  testflight:
    name: 上传 TestFlight
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # 在 GitHub 仓库 Settings › Secrets and variables › Actions 里添加这四个：
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}          # 10 位 Team ID
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}                # App Store Connect API Key 的 Key ID
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}          # Issuer ID（UUID）
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}                # AuthKey_XXXX.p8 文件的完整内容
    steps:
      - name: 检查密钥
        id: secrets
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::未配置 APPLE_TEAM_ID / ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8，跳过 TestFlight 上传。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: 写入 API Key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          sed "s/__TEAM_ID__/${APPLE_TEAM_ID}/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      - name: 归档
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          # 归档时不签名，导出时由 Xcode 云端签名（Cloud Managed Distribution Certificate）统一签名，
          # 这样 CI 机器上不需要任何证书，也不需要注册测试设备。
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LiveSubtitle.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee archive.log | grep -E '(error|ARCHIVE (SUCCEEDED|FAILED))' || true
          grep -q 'ARCHIVE SUCCEEDED' archive.log

      - name: 签名并上传 TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LiveSubtitle.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### 已上传 TestFlight：构建号 ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: archive.log
